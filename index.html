<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6e1f2f" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wine: #6e1f2f;
      --wine-deep: #4e1320;
      --wine-soft: #8c2f42;
      --gold: #c9a35b;
      --gold-light: #ead29c;
      --gold-dark: #946f2e;
      --ivory: #fbf6f1;
      --blush: #f4e4e4;
      --ink: #3c1b23;
      --muted: #6e4a52;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% 25%, #f2e2df 0%, #e4cdcf 60%, #d8bcc1 100%);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    body.locked {
      overflow: hidden;
      height: 100vh;
      height: 100svh;
      overscroll-behavior-y: none;
    }

    /* ============================================================
       CENTERED 480PX STAGE FRAME (PARCHMENT + PRE-BLURRED ROSES)
       ============================================================ */
    #stage-frame {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--ivory);
      box-shadow: 0 0 64px rgba(78, 19, 32, 0.16);
    }

    #card-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: var(--ivory);
      background-position: center top;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    /* Low Z-Index Pre-Blurred Parallax Roses Strictly Behind Text (z: 1) */
    #ambient-roses {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #ambient-roses.visible { opacity: 1; }

    .ambient-rose {
      position: absolute;
      width: 185px;
      height: auto;
      opacity: 0.66;
      will-change: transform;
      user-select: none;
    }
    .ambient-rose.tl { top: -38px; left: -46px; transform-origin: 20% 20%; }
    .ambient-rose.tr { top: -34px; right: -46px; transform-origin: 80% 20%; }
    .ambient-rose.ml { top: 44%; left: -72px; width: 155px; opacity: 0.54; }
    .ambient-rose.mr { top: 56%; right: -72px; width: 155px; opacity: 0.54; }
    .ambient-rose.bl { bottom: -44px; left: -46px; transform-origin: 20% 80%; }
    .ambient-rose.br { bottom: -44px; right: -46px; transform-origin: 80% 80%; }

    /* Hanging Marigold Strings — ALWAYS IN FRONT OF PAGE ELEMENTS (z: 30) */
    #marigold-bar {
      position: fixed;
      top: calc(-6px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 112px;
      z-index: 30;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    #marigold-bar.visible { opacity: 1; }

    .marigold-strand {
      width: 34px;
      height: auto;
      transform-origin: top center;
      will-change: transform;
      filter: drop-shadow(0 4px 6px rgba(78, 19, 32, 0.18));
    }
    .marigold-strand.short { height: 70px; object-fit: contain; object-position: top; }
    .marigold-strand.tall { height: 102px; object-fit: contain; object-position: top; }

    /* Falling Petals Canvas (z: 25) */
    #petal-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      pointer-events: none;
    }

    /* Floating Audio / Our Song Button (z: 40) */
    #music-btn {
      position: fixed;
      right: max(14px, calc(50% - 226px));
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      z-index: 40;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(201, 163, 91, 0.72);
      background: rgba(110, 31, 47, 0.92);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      color: var(--gold-light);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 8px 22px rgba(78, 19, 32, 0.28);
      cursor: pointer;
    }
    #music-btn.show { display: inline-flex; }
    #music-btn .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    #music-btn .bars span {
      width: 2.5px;
      background: var(--gold-light);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease;
    }
    #music-btn.playing .bars span:nth-child(1) { animation: eq 0.9s infinite ease-in-out; }
    #music-btn.playing .bars span:nth-child(2) { animation: eq 0.65s infinite ease-in-out 0.15s; }
    #music-btn.playing .bars span:nth-child(3) { animation: eq 0.8s infinite ease-in-out 0.3s; }
    @keyframes eq { 0%,100% { height: 4px; } 50% { height: 12px; } }

    /* ============================================================
       1. OPENING SCREEN: 3D WINE-VELVET BOOK (z: 60)
       ============================================================ */
    #opening-screen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 16px);
      background: radial-gradient(circle at 50% 42%, #fdf5f3 0%, #f3dfe1 62%, #e8ccd1 100%);
      overflow: hidden;
      transition: opacity 0.85s ease, transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #opening-screen.zooming {
      transform: scale(1.22);
      opacity: 0;
      pointer-events: none;
    }
    #opening-screen.gone { display: none; }

    .open-rose {
      position: absolute;
      width: 205px;
      opacity: 0.65;
      z-index: 1;
      pointer-events: none;
      will-change: transform;
      animation: floatSway 7s ease-in-out infinite alternate;
    }
    .open-rose.r1 { top: -40px; left: -55px; }
    .open-rose.r2 { bottom: -45px; right: -55px; animation-delay: -3.2s; }
    .open-rose.r3 { top: 14%; right: -78px; width: 165px; opacity: 0.48; animation-delay: -1.5s; }
    .open-rose.r4 { bottom: 14%; left: -78px; width: 165px; opacity: 0.48; animation-delay: -4.4s; }
    @keyframes floatSway {
      0% { transform: translate3d(0, 0, 0) rotate(-3deg) scale(1); }
      100% { transform: translate3d(8px, 10px, 0) rotate(3deg) scale(1.04); }
    }

    .book-stage {
      position: relative;
      z-index: 4;
      width: min(72vw, 275px, 46vh);
      aspect-ratio: 3 / 4.2;
      -webkit-perspective: 1300px;
      perspective: 1300px;
      cursor: pointer;
    }

    .book-3d {
      position: relative;
      width: 100%;
      height: 100%;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      transform: rotateY(-10deg) rotateX(4deg);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .book-stage.opened .book-3d {
      transform: rotateY(0deg) rotateX(0deg) scale(1.06);
    }

    .book-inside {
      position: absolute;
      inset: 4px 4px 4px 10px;
      border-radius: 4px 14px 14px 4px;
      background: linear-gradient(155deg, #fffaf4 0%, #f5e6e2 100%);
      border: 1px solid rgba(201, 163, 91, 0.55);
      box-shadow: inset 12px 0 24px rgba(110, 31, 47, 0.14), 0 18px 40px rgba(78, 19, 32, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
    }
    .book-inside p {
      font-family: var(--font-display);
      color: var(--wine);
      font-size: 1.1rem;
      line-height: 1.4;
    }

    .book-spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 18px;
      border-radius: 6px 0 0 6px;
      background: linear-gradient(90deg, #3c0c16 0%, #6e1f2f 55%, #4b121f 100%);
      box-shadow: inset -2px 0 6px rgba(234, 210, 156, 0.25);
      z-index: 3;
    }

    .book-cover {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      border-radius: 6px 16px 16px 6px;
      background:
        radial-gradient(circle at 32% 24%, rgba(164, 52, 74, 0.42), transparent 58%),
        radial-gradient(circle at 80% 80%, rgba(45, 7, 15, 0.65), transparent 60%),
        linear-gradient(145deg, #7f2538 0%, #6e1f2f 48%, #4d111e 100%);
      box-shadow: 0 24px 48px rgba(62, 14, 24, 0.38), inset 0 0 0 1px rgba(234, 210, 156, 0.35);
      transition: transform 1.25s cubic-bezier(0.32, 0.04, 0.18, 1);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .book-stage.opened .book-cover { transform: rotateY(-155deg); }

    .cover-frame {
      width: 100%;
      height: 100%;
      border: 1.5px solid var(--gold);
      border-radius: 4px 12px 12px 4px;
      padding: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }
    .cover-frame::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(234, 210, 156, 0.45);
      border-radius: 2px 9px 9px 2px;
      pointer-events: none;
    }
    .cover-ganesh { width: clamp(60px, 11vh, 80px); height: clamp(60px, 11vh, 80px); object-fit: contain; }
    .cover-sub {
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.9;
    }
    .cover-title {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 3.4vh, 1.5rem);
      font-weight: 600;
      color: var(--gold-light);
      line-height: 1.25;
    }
    .cover-date {
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: rgba(234, 210, 156, 0.85);
      text-transform: uppercase;
    }

    .open-status {
      position: relative;
      z-index: 4;
      margin-top: clamp(16px, 3vh, 26px);
      min-height: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .loader-track {
      width: 170px;
      height: 3px;
      border-radius: 999px;
      background: rgba(110, 31, 47, 0.16);
      overflow: hidden;
    }
    .loader-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
      transition: width 0.25s ease;
    }
    .loader-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--wine);
      opacity: 0.82;
    }
    .tap-prompt {
      display: none;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(255, 250, 244, 0.88);
      border: 1px solid rgba(201, 163, 91, 0.72);
      color: var(--wine);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(110, 31, 47, 0.14);
      animation: pulseTap 2s ease-in-out infinite;
      cursor: pointer;
    }
    .tap-prompt.ready { display: inline-block; }
    @keyframes pulseTap {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    /* ============================================================
       MAIN CONTINUOUS INVITATION COLUMN (z: 10) + GLASS SECTIONS
       ============================================================ */
    main.invitation-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    section.band {
      position: relative;
      padding: 26px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Frosted Glassmorphism Section Surface */
    .glass-panel {
      width: 100%;
      max-width: 404px;
      padding: 30px 18px;
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(255, 252, 249, 0.58) 0%, rgba(250, 239, 237, 0.38) 100%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      backdrop-filter: blur(14px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, 0.74);
      box-shadow:
        0 14px 36px rgba(110, 31, 47, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 0 0 1px rgba(201, 163, 91, 0.24);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .glass-panel.carousel-panel {
      padding-left: 10px;
      padding-right: 10px;
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 8px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 6.5vw, 2.15rem);
      font-weight: 600;
      color: var(--wine);
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .section-sub {
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 310px;
    }

    .reveal-el {
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      transition: opacity 0.85s ease, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-el.in {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    /* ============================================================
       2. FIRST PAGE (1 SCREEN, GLASS ARCH FRAME, GARLAND CLEARANCE)
       ============================================================ */
    #sec-hero {
      height: 100vh;
      height: 100svh;
      min-height: 480px;
      max-height: 920px;
      padding: calc(clamp(54px, 9.5vh, 84px) + env(safe-area-inset-top, 0px)) 18px clamp(14px, 2.8vh, 24px);
      justify-content: center;
      overflow: hidden;
    }

    .hero-arch {
      position: relative;
      width: 100%;
      max-width: 356px;
      height: 100%;
      max-height: 650px;
      border-radius: 190px 190px 28px 28px;
      border: 1.5px solid rgba(201, 163, 91, 0.88);
      padding: 8px;
      box-shadow:
        0 22px 46px rgba(110, 31, 47, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      background: linear-gradient(160deg, rgba(255, 252, 249, 0.54) 0%, rgba(250, 239, 237, 0.34) 100%);
      -webkit-backdrop-filter: blur(12px) saturate(130%);
      backdrop-filter: blur(12px) saturate(130%);
      display: flex;
      flex-direction: column;
    }

    .hero-arch-inner {
      position: relative;
      flex: 1;
      border-radius: 182px 182px 20px 20px;
      border: 1px solid rgba(201, 163, 91, 0.44);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(14px, 3vh, 30px) 16px clamp(12px, 2.2vh, 20px);
    }

    .hero-bg-wrap {
      position: absolute;
      inset: -8%;
      z-index: 0;
      will-change: transform;
      animation: slowZoom 22s ease-in-out infinite alternate;
    }
    .hero-bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      display: block;
    }
    .hero-bg-photo.fallback-blur {
      filter: blur(7px);
      -webkit-filter: blur(7px);
      transform: scale(1.06);
    }
    @keyframes slowZoom {
      0% { transform: scale(1) translate3d(0, 0, 0); }
      100% { transform: scale(1.12) translate3d(0, -1.5%, 0); }
    }

    .hero-wash {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg,
        rgba(251, 246, 241, 0.72) 0%,
        rgba(251, 246, 241, 0.5) 50%,
        rgba(249, 240, 238, 0.78) 100%);
    }

    .hero-body {
      position: relative;
      z-index: 2;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.1vh, 11px);
    }

    .hero-ganesh {
      width: clamp(42px, 7.2vh, 64px);
      height: clamp(42px, 7.2vh, 64px);
      object-fit: contain;
    }

    .hero-together {
      font-size: clamp(9px, 1.4vh, 10.5px);
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-dark);
    }

    .couple-name {
      font-family: var(--font-display);
      font-size: clamp(1.65rem, min(7.6vw, 4.4vh), 2.5rem);
      font-weight: 700;
      color: var(--wine);
      line-height: 1.08;
      min-height: 1.12em;
    }
    .couple-name .ch {
      display: inline-block;
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(0.95);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .couple-name .ch.show {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .parent-line {
      font-size: clamp(10.5px, 1.65vh, 11.8px);
      line-height: 1.4;
      color: var(--muted);
      max-width: 260px;
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .parent-line.show { opacity: 1; transform: translate3d(0, 0, 0); }

    .hero-amp {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(1.35rem, 2.8vh, 1.75rem);
      color: var(--gold-dark);
      line-height: 1;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .hero-amp.show { opacity: 1; }

    .hero-invite-line {
      font-size: clamp(11px, 1.75vh, 12.2px);
      line-height: 1.48;
      color: var(--ink);
      max-width: 256px;
      margin-top: 2px;
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .hero-invite-line.show { opacity: 1; transform: translate3d(0, 0, 0); }

    .scroll-cue {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--gold-dark);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
      animation: bounceCue 2s ease-in-out infinite;
    }
    @keyframes bounceCue {
      0%,100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, 5px, 0); }
    }

    /* ============================================================
       3. SAVE THE DATE — PULL-TO-REVEAL SCROLL + POST-REVEAL TIMER
       ============================================================ */
    .scroll-wrap {
      width: 100%;
      max-width: 340px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gold-rod {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f3dfb0 0%, #c9a35b 48%, #8f6a29 100%);
      box-shadow: 0 5px 14px rgba(110, 31, 47, 0.22);
      position: relative;
      z-index: 3;
    }
    .gold-rod::before, .gold-rod::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle at 32% 30%, #fff0c6, #c9a35b 55%, #7e5b21 100%);
      box-shadow: 0 3px 8px rgba(78, 19, 32, 0.25);
    }
    .gold-rod::before { left: -8px; }
    .gold-rod::after { right: -8px; }

    .scroll-paper {
      position: relative;
      width: 90%;
      max-height: 22px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 251, 246, 0.94) 0%, rgba(249, 236, 232, 0.92) 100%);
      border-left: 1.5px solid rgba(201, 163, 91, 0.75);
      border-right: 1.5px solid rgba(201, 163, 91, 0.75);
      box-shadow: 0 14px 32px rgba(110, 31, 47, 0.14);
      transition: max-height 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scroll-paper.dragging { transition: none; }
    .scroll-paper.unrolled { max-height: 360px; }

    .scroll-corner-rose {
      position: absolute;
      width: 105px;
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    .scroll-corner-rose.tl { top: -18px; left: -20px; }
    .scroll-corner-rose.br { bottom: -18px; right: -20px; transform: rotate(180deg); }

    .scroll-inner {
      position: relative;
      z-index: 2;

    .scroll-bottom-rod {

    /* Strictly Post-Reveal Countdown & Single Add to Calendar Button */

      visibility: hidden;

                  margin-top 0.65s ease;

      align-items: center;
      gap: 13px;

    .countdown-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      padding: 11px 16px;

      background: rgba(255, 252, 248, 0.78);
      border: 1px solid rgba(201, 163, 91, 0.65);

      color: var(--wine);

      font-size: 10.5px;
      color: var(--muted);

    .btn-gold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, var(--wine) 0%, var(--wine-deep) 100%);
      color: var(--gold-light);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(110, 31, 47, 0.22);
      transition: transform 0.2s ease;
    }
    .btn-gold:active { transform: scale(0.97); }
    .btn-outline {
      background: rgba(255, 252, 248, 0.8);
      color: var(--wine);
      box-shadow: 0 6px 16px rgba(110, 31, 47, 0.08);
    }

    /* ============================================================
       4 & 5. SWIPEABLE / DRAGGABLE 3D CAROUSELS
       ============================================================ */
    .carousel-shell {
      position: relative;
      width: 100%;
      margin-top: 20px;
      user-select: none;
      touch-action: pan-y;
    }

    .carousel-stage {
      position: relative;
      width: 100%;
      height: 388px;
      -webkit-perspective: 1100px;
      perspective: 1100px;
      overflow: hidden;
      cursor: grab;
    }
    .carousel-stage:active { cursor: grabbing; }
    .carousel-stage.story-stage { height: 372px; }

    .c-card {
      position: absolute;
      top: 10px;
      left: 50%;
      width: min(74vw, 274px);
      height: 360px;
      margin-left: calc(min(74vw, 274px) / -2);
      border-radius: 22px;
      overflow: hidden;
      border: 1.5px solid rgba(201, 163, 91, 0.78);
      background: #2b1318;
      box-shadow: 0 18px 38px rgba(78, 19, 32, 0.2);
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.48s ease;
      will-change: transform, opacity;
      cursor: pointer;
    }
    .c-card.story-card { height: 344px; background: rgba(255, 251, 246, 0.92); }

    .c-card[data-pos="0"]  { transform: translate3d(0, 0, 0) scale(1); opacity: 1; z-index: 5; }
    .c-card[data-pos="-1"] { transform: translate3d(-64%, 10px, -90px) scale(0.84) rotateY(14deg); opacity: 0.52; z-index: 3; }
    .c-card[data-pos="1"]  { transform: translate3d(64%, 10px, -90px) scale(0.84) rotateY(-14deg); opacity: 0.52; z-index: 3; }
    .c-card[data-pos="hidden"] { transform: translate3d(0, 20px, -180px) scale(0.7); opacity: 0; z-index: 1; pointer-events: none; }

    /* Blurred illustrated / photographic scene inside each festivity card */
    .event-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    .event-bg.fallback-blur {
      filter: blur(5px);
      -webkit-filter: blur(5px);
      transform: scale(1.08);
    }
    /* Light atmospheric scrim so the blurred artwork stays clearly visible */
    .event-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg,
        rgba(38, 12, 18, 0.14) 0%,
        rgba(38, 12, 18, 0.28) 45%,
        rgba(32, 10, 16, 0.54) 100%);
    }
    .event-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .event-icon-wrap {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 250, 245, 0.88);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1.2px solid rgba(234, 210, 156, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(32, 10, 16, 0.25);
      animation: iconBob 3.2s ease-in-out infinite;
    }
    @keyframes iconBob {
      0%,100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -4px, 0); }
    }
    .event-glass-box {
      width: 100%;
      padding: 14px 12px;
      border-radius: 16px;
      background: rgba(255, 250, 245, 0.72);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
      backdrop-filter: blur(10px) saturate(130%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 20px rgba(38, 12, 18, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .event-name {
      font-family: var(--font-display);
      font-size: 1.42rem;
      font-weight: 700;
      color: var(--wine);
      line-height: 1.15;
    }
    .event-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.4;
    }
    .event-meta strong { color: var(--wine); font-weight: 600; }
    .dress-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 251, 246, 0.88);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 163, 91, 0.7);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 6px 14px rgba(38, 12, 18, 0.18);
    }
    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid rgba(60, 27, 35, 0.25);
      flex-shrink: 0;
    }

    .story-img {
      width: 100%;
      height: 258px;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .story-cap {
      height: 86px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 14px;
      line-height: 1.38;
      color: var(--wine);
      background: linear-gradient(180deg, rgba(255, 251, 246, 0.92) 0%, rgba(248, 236, 233, 0.96) 100%);
    }

    .carousel-nav {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .nav-arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(201, 163, 91, 0.72);
      background: rgba(255, 251, 246, 0.82);
      color: var(--wine);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dots { display: inline-flex; gap: 7px; align-items: center; }
    .dot-btn {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: none;
      background: rgba(110, 31, 47, 0.24);
      cursor: pointer;
      transition: width 0.25s ease, background 0.25s ease;
    }
    .dot-btn.active { width: 20px; background: var(--wine); }

    /* ============================================================
       6. GRAND RECEPTION (DEEP WINE GLASS CARD)
       ============================================================ */
    .reception-card {
      position: relative;
      width: 100%;
      max-width: 404px;
      border-radius: 28px;
      padding: 36px 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(164, 52, 74, 0.52), transparent 55%),
        linear-gradient(150deg, rgba(119, 34, 52, 0.92) 0%, rgba(110, 31, 47, 0.88) 48%, rgba(71, 16, 28, 0.94) 100%);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1.5px solid var(--gold);
      box-shadow: 0 22px 46px rgba(78, 19, 32, 0.3), inset 0 1px 0 rgba(255, 238, 200, 0.35);
      color: var(--gold-light);
    }
    .reception-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1px solid rgba(234, 210, 156, 0.34);
      pointer-events: none;
      z-index: 1;
    }

    .rec-rose {
      position: absolute;
      width: 140px;
      opacity: 0.42;
      z-index: 0;
      pointer-events: none;
      transform: scale(0.82);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rec-rose.tl { top: -32px; left: -34px; }
    .rec-rose.br { bottom: -32px; right: -34px; transform: rotate(180deg) scale(0.82); }
    .reception-card.in .rec-rose.tl { transform: scale(1); }
    .reception-card.in .rec-rose.br { transform: rotate(180deg) scale(1); }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 10px var(--gold-light);
      z-index: 1;
      pointer-events: none;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 0.95; transform: scale(1.25); }
    }

    .rec-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .rec-inner .eyebrow { color: var(--gold-light); opacity: 0.85; margin-bottom: 0; }
    .rec-inner .section-title { color: #fff5df; margin-bottom: 2px; }
    .rec-divider {
      width: 68px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 4px 0;
    }
    .rec-detail { font-size: 13px; line-height: 1.65; color: rgba(255, 245, 223, 0.92); }
    .rec-pill {
      margin-top: 4px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(234, 210, 156, 0.55);
      background: rgba(255, 245, 223, 0.1);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    /* ============================================================
       7. LOCATION
       ============================================================ */
    .map-card {
      width: 100%;
      max-width: 360px;
      margin-top: 16px;
      border-radius: 22px;
      overflow: hidden;
      border: 1.5px solid rgba(201, 163, 91, 0.72);
      background: rgba(255, 252, 248, 0.72);
      box-shadow: 0 14px 32px rgba(110, 31, 47, 0.1);
    }
    .map-visual {
      display: block;
      position: relative;
      width: 100%;
      height: 205px;
      background: linear-gradient(155deg, #f8eee7 0%, #f1e1dc 100%);
      overflow: hidden;
      text-decoration: none;
    }
    .map-svg { width: 100%; height: 100%; display: block; }
    .route-dash { stroke-dasharray: 8 7; animation: dashFlow 1.6s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -30; } }
    .pin-pulse { transform-origin: 248px 72px; animation: pinRing 2.1s ease-out infinite; }
    @keyframes pinRing {
      0% { transform: scale(0.7); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .map-tap-badge {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(110, 31, 47, 0.9);
      color: var(--gold-light);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .map-info {
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .venue-name {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 700;
      color: var(--wine);
    }
    .venue-addr { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
    .map-actions {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .map-actions .btn-gold { flex: 1 1 134px; padding: 11px 14px; font-size: 11px; }

    /* ============================================================
       8. CLOSING
       ============================================================ */
    #sec-closing { padding-bottom: 84px; }
    .closing-ganesh { width: 64px; height: 64px; object-fit: contain; margin-bottom: 14px; }
    .closing-msg {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--wine);
      line-height: 1.3;
      max-width: 300px;
      margin-bottom: 12px;
    }
    .closing-family { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      transform: translate3d(-50%, 16px, 0);
      z-index: 80;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--wine-deep);
      color: var(--gold-light);
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toast.show { opacity: 1; transform: translate3d(-50%, 0, 0); }

    .paused-anim, .paused-anim * { animation-play-state: paused !important; }
  </style>
</head>

    /* ============================================================
       TRUE CROSS-BROWSER PREMULTIPLIED BLUR (WORKS ON iOS 15-18+)
       ============================================================ */
    const ASSETS = {};

    function mkCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }

    function blurCanvasCrossBrowser(src, radius, flipX, format) {
      const r = Math.max(1, Math.round(radius));
      const pad = format === 'jpeg' ? 0 : (r * 2 + 4);
      const sw = src.width;
      const sh = src.height;
      const w = sw + pad * 2;
      const h = sh + pad * 2;
      const c = mkCanvas(w, h);
      const ctx = c.getContext('2d');

      ctx.save();
      if (flipX) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(src, pad, pad);
      ctx.restore();

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const len = w * h;
      const buf1 = new Float32Array(len * 4);
      const buf2 = new Float32Array(len * 4);

      for (let i = 0; i < len; i++) {
        const idx = i * 4;
        const a = data[idx + 3] / 255;
        buf1[idx] = data[idx] * a;
        buf1[idx + 1] = data[idx + 1] * a;
        buf1[idx + 2] = data[idx + 2] * a;
        buf1[idx + 3] = data[idx + 3];
      }

      const win = r * 2 + 1;
      for (let pass = 0; pass < 2; pass++) {
        for (let y = 0; y < h; y++) {
          let rS = 0, gS = 0, bS = 0, aS = 0;
          const row = y * w;
          for (let k = -r; k <= r; k++) {
            const x = k < 0 ? 0 : (k >= w ? w - 1 : k);
            const idx = (row + x) * 4;
            rS += buf1[idx]; gS += buf1[idx + 1]; bS += buf1[idx + 2]; aS += buf1[idx + 3];
          }
          for (let x = 0; x < w; x++) {
            const o = (row + x) * 4;
            buf2[o] = rS / win; buf2[o + 1] = gS / win; buf2[o + 2] = bS / win; buf2[o + 3] = aS / win;
            const xA = x + r + 1 >= w ? w - 1 : x + r + 1;
            const xS = x - r < 0 ? 0 : x - r;
            const iA = (row + xA) * 4, iS = (row + xS) * 4;
            rS += buf1[iA] - buf1[iS]; gS += buf1[iA + 1] - buf1[iS + 1];
            bS += buf1[iA + 2] - buf1[iS + 2]; aS += buf1[iA + 3] - buf1[iS + 3];
          }
        }
        for (let x = 0; x < w; x++) {
          let rS = 0, gS = 0, bS = 0, aS = 0;
          for (let k = -r; k <= r; k++) {
            const y = k < 0 ? 0 : (k >= h ? h - 1 : k);
            const idx = (y * w + x) * 4;
            rS += buf2[idx]; gS += buf2[idx + 1]; bS += buf2[idx + 2]; aS += buf2[idx + 3];
          }
          for (let y = 0; y < h; y++) {
            const o = (y * w + x) * 4;
            buf1[o] = rS / win; buf1[o + 1] = gS / win; buf1[o + 2] = bS / win; buf1[o + 3] = aS / win;
            const yA = y + r + 1 >= h ? h - 1 : y + r + 1;
            const yS = y - r < 0 ? 0 : y - r;
            const iA = (yA * w + x) * 4, iS = (yS * w + x) * 4;
            rS += buf2[iA] - buf2[iS]; gS += buf2[iA + 1] - buf2[iS + 1];
            bS += buf2[iA + 2] - buf2[iS + 2]; aS += buf2[iA + 3] - buf2[iS + 3];
          }
        }
      }

      for (let i = 0; i < len; i++) {
        const idx = i * 4;
        const a = buf1[idx + 3];
        if (a > 0.5) {
          const inv = 255 / a;
          data[idx] = Math.min(255, Math.round(buf1[idx] * inv));
          data[idx + 1] = Math.min(255, Math.round(buf1[idx + 1] * inv));
          data[idx + 2] = Math.min(255, Math.round(buf1[idx + 2] * inv));
          data[idx + 3] = Math.min(255, Math.round(a));
        } else {
          data[idx] = data[idx + 1] = data[idx + 2] = data[idx + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return format === 'jpeg' ? c.toDataURL('image/jpeg', 0.84) : c.toDataURL('image/png');
    }

    function bakeGanesh() {
      const c = mkCanvas(220, 220);
      const ctx = c.getContext('2d');
      const cx = 110, cy = 110;
      const g = ctx.createRadialGradient(cx, cy, 12, cx, cy, 98);
      g.addColorStop(0, '#fff2c9');
      g.addColorStop(0.55, '#c9a35b');
      g.addColorStop(1, '#8c6626');

      ctx.strokeStyle = g;
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(cx, cy, 94, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx, cy, 84, 0, Math.PI * 2); ctx.stroke();

      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        ctx.fillStyle = '#ead29c';
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * 89, cy + Math.sin(a) * 89, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = g;
      ctx.strokeStyle = g;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath(); ctx.moveTo(92, 66); ctx.quadraticCurveTo(110, 36, 128, 66); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(110, 44, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(74, 96, 17, 25, -0.22, 0, Math.PI * 2); ctx.ellipse(146, 96, 17, 25, 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(110, 92, 24, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(110, 104); ctx.bezierCurveTo(110, 126, 98, 134, 86, 128); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(110, 146, 28, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(76, 168); ctx.quadraticCurveTo(110, 178, 144, 168); ctx.stroke();

      ctx.strokeStyle = '#6e1f2f';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(110, 77); ctx.lineTo(110, 88); ctx.stroke();
      return c.toDataURL('image/png');
    }

    function drawPainterlyRose(ctx, x, y, r, hueBase) {
      ctx.save();
      ctx.translate(x, y);
      for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate((i * 1.55) + 0.4);
        const lg = ctx.createLinearGradient(0, 0, r * 1.6, 0);
        lg.addColorStop(0, '#446348');
        lg.addColorStop(1, '#799974');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.ellipse(r * 0.95, 0, r * 0.65, r * 0.28, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      const rings = [
        { count: 7, dist: r * 0.56, pw: r * 0.52, ph: r * 0.42, c1: hueBase[0], c2: hueBase[1] },
        { count: 6, dist: r * 0.34, pw: r * 0.42, ph: r * 0.34, c1: hueBase[1], c2: hueBase[2] },
        { count: 5, dist: r * 0.16, pw: r * 0.28, ph: r * 0.24, c1: hueBase[2], c2: hueBase[3] }
      ];
      rings.forEach((ring, ri) => {
        for (let i = 0; i < ring.count; i++) {
          const a = (i / ring.count) * Math.PI * 2 + ri * 0.45;
          ctx.save();
          ctx.rotate(a);
          const pg = ctx.createRadialGradient(ring.dist * 0.5, 0, 2, ring.dist, 0, ring.pw);

    function loadImageSafe(url, tryCors, timeoutMs = 2500) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        const attempt = (withCors) => {
          const img = new Image();
          if (withCors) img.crossOrigin = 'anonymous';
          let settled = false;
          const done = (val) => {
            if (settled) return;
            settled = true;
            clearTimeout(t);
            resolve(val);
          };
          const t = setTimeout(() => done(null), timeoutMs);
          img.onload = () => done({ img, corsOk: withCors });
          img.onerror = () => {
            clearTimeout(t);
            if (withCors && !settled) {
              settled = true;
              attempt(false);
            } else {
              done(null);
            }
          };
          img.src = url;
        };
        attempt(!!tryCors);
      });
    }

        master.gain.setTargetAtTime(0.075, ctx.currentTime, 0.8);

        const scale = [261.63, 293.66, 329.63, 369.99, 392.0, 440.0, 493.88, 523.25];
        const playNote = () => {
          if (!isPlaying || !ctx) return;
          const now = ctx.currentTime;
          const freq = scale[Math.floor(Math.random() * scale.length)];
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.28, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
          osc.connect(gain).connect(master);
          osc.start(now);
          osc.stop(now + 2.5);
        };
        playNote();
        clearInterval(timer);
        timer = setInterval(playNote, 1350);
      }

      function play() {
        btn.classList.add('show');
        if (WEDDING_CONFIG.music.mode === 'youtube') return;
        isPlaying = true;
        btn.classList.add('playing');
        if (WEDDING_CONFIG.music.mp3Url) {
          try { audioEl.volume = 0; } catch (e) {}
          const p = audioEl.play();
          if (p && p.then) {
            p.then(() => {
              let v = 0;
              const fade = setInterval(() => {
                v = Math.min(0.45, v + 0.03);
                try { audioEl.volume = v; } catch (e) { clearInterval(fade); }
                if (v >= 0.45 || !isPlaying) clearInterval(fade);
              }, 90);
            }).catch(() => {
              isPlaying = false;
              btn.classList.remove('playing');
            });
          }
        } else {
          startSynth();
        }
      }

      function pause() {
        isPlaying = false;
        btn.classList.remove('playing');
        clearInterval(timer);
        if (WEDDING_CONFIG.music.mp3Url) {
          audioEl.pause();
        } else if (master && ctx) {
          master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2);
        }
      }

      function toggle() { isPlaying ? pause() : play(); }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isPlaying) pause();
      });

      return { init, play, pause };
    })();

    /* ============================================================
       PETAL & GOLD CONFETTI ENGINE
       ============================================================ */
    const Petals = (() => {
      const canvas = document.getElementById('petal-canvas');
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, running = false;
      const particles = [];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      function spawnShower(count = 20) {
        for (let i = 0; i < count; i++) {
          particles.push({
            type: 'petal',
            x: Math.random() * W,
            y: -20 - Math.random() * 140,
            vx: (Math.random() - 0.5) * 0.8,
            vy: 0.9 + Math.random() * 1.2,
            size: 14 + Math.random() * 12,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.04,
            sway: Math.random() * Math.PI * 2,
            life: 1,
            decay: 0.0022
          });
        }
        start();
      }

      function spawnBurst(cx, cy) {
        for (let i = 0; i < 36; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 2.2 + Math.random() * 4.5;
          particles.push({
            type: i % 2 === 0 ? 'petal' : 'gold',
            x: cx,
            y: cy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 2.4,
            size: i % 2 === 0 ? 15 + Math.random() * 9 : 5 + Math.random() * 4,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.14,
            sway: Math.random() * 6,
            life: 1,
            decay: 0.0085
          });
        }
        start();
      }

      function tick() {
        if (!running || document.hidden) return;
        ctx.clearRect(0, 0, W, H);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.sway += 0.03;
          p.x += p.vx + Math.sin(p.sway) * 0.35;
          p.y += p.vy;
          if (p.type === 'gold') p.vy += 0.08;
          p.rot += p.vrot;
          p.life -= p.decay;

          if (p.life <= 0 || p.y > H + 40) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life * 1.4);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          if (p.type === 'petal' && ASSETS.petalCanvas) {
            ctx.drawImage(ASSETS.petalCanvas, -p.size / 2, -p.size / 2, p.size, p.size);
          } else {
            ctx.fillStyle = '#e5c171';
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          }
          ctx.restore();
        }
        if (particles.length > 0) {
          requestAnimationFrame(tick);
        } else {
          running = false;
          ctx.clearRect(0, 0, W, H);
        }
      }

      function start() {
        if (!running) {
          running = true;
          requestAnimationFrame(tick);
        }
      }

      return { spawnShower, spawnBurst };
    })();

    /* ============================================================
       UNIFIED TOUCH + MOUSE POINTER 3D CAROUSEL (1 CARD PER SWIPE)
       ============================================================ */
    function initCarousel(shellId, stageId, dotsId, items, renderCard) {
      const shell = document.getElementById(shellId);
      const stage = document.getElementById(stageId);
      const dotsWrap = document.getElementById(dotsId);
      let idx = 0, startX = 0, deltaX = 0, dragging = false, dragged = false;

      const cards = items.map((item, i) => {
        const el = renderCard(item, i);
        el.addEventListener('click', () => {
          if (dragged) return;
          const pos = Number(el.dataset.pos);
          if (pos === -1) go(-1);
          else if (pos === 1) go(1);
        });
        stage.appendChild(el);
        return el;
      });

      const dots = items.map((_, i) => {
        const b = document.createElement('button');
        b.className = 'dot-btn';
        b.type = 'button';
        b.setAttribute('aria-label', `Slide ${i + 1}`);
        b.onclick = () => { idx = i; update(); };
        dotsWrap.appendChild(b);
        return b;
      });

      function update() {
        const n = items.length;
        cards.forEach((c, i) => {
          let diff = i - idx;
          if (diff > n / 2) diff -= n;
          if (diff < -n / 2) diff += n;
          if (diff === 0) c.dataset.pos = '0';
          else if (diff === -1) c.dataset.pos = '-1';
          else if (diff === 1) c.dataset.pos = '1';
          else c.dataset.pos = 'hidden';
        });
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      }

      function go(step) {
        idx = (idx + step + items.length) % items.length;
        update();
      }

      shell.querySelector('[data-prev]').onclick = () => go(-1);
      shell.querySelector('[data-next]').onclick = () => go(1);

      const onStart = (x) => { dragging = true; dragged = false; startX = x; deltaX = 0; };
      const onMove = (x) => {
        if (!dragging) return;
        deltaX = x - startX;
        if (Math.abs(deltaX) > 10) dragged = true;
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        if (deltaX < -34) go(1);
        else if (deltaX > 34) go(-1);
        setTimeout(() => { dragged = false; }, 60);
      };

      if (window.PointerEvent) {
        stage.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          onStart(e.clientX);
        });
        window.addEventListener('pointermove', (e) => onMove(e.clientX), { passive: true });
        window.addEventListener('pointerup', onEnd, { passive: true });
        window.addEventListener('pointercancel', onEnd, { passive: true });
      } else {
        stage.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
        stage.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
        stage.addEventListener('touchend', onEnd, { passive: true });
      }

      update();
    }

    /* ============================================================
       SAVE THE DATE: PULL-TO-REVEAL + POST-REVEAL TIMER + SINGLE BUTTON
       ============================================================ */
    function initSaveTheDate() {
      const paper = document.getElementById('scroll-paper');
      const tassel = document.getElementById('tassel-zone');
      const hint = document.getElementById('pull-hint');
      const postReveal = document.getElementById('save-date-post-reveal');
      const calBtn = document.getElementById('add-cal-btn');
      const start = new Date(WEDDING_CONFIG.wedding.isoDateTime);
      const end = new Date(start.getTime() + 4 * 3600000);
      const targetMs = start.getTime();
      const fmtUtc = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      const gcalParams = new URLSearchParams({
        action: 'TEMPLATE',
        text: `${WEDDING_CONFIG.couple.groom} & ${WEDDING_CONFIG.couple.bride} Wedding`,
        dates: `${fmtUtc(start)}/${fmtUtc(end)}`,
        details: `Pheras at ${WEDDING_CONFIG.wedding.pherasTime}. Maps: ${WEDDING_CONFIG.wedding.mapsUrl}`,
        location: WEDDING_CONFIG.wedding.fullAddress
      });
      const gcalFallbackUrl = `https://calendar.google.com/calendar/render?${gcalParams.toString()}`;

      let revealed = false, dragging = false, startY = 0, pulled = 0;
      let sectionVisible = true;

      function updateCountdown() {
        if (!revealed || !sectionVisible || document.hidden) return;
        const diff = Math.max(0, targetMs - Date.now());
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('cd-d').textContent = String(d).padStart(2, '0');
        document.getElementById('cd-h').textContent = String(h).padStart(2, '0');
        document.getElementById('cd-m').textContent = String(m).padStart(2, '0');
        document.getElementById('cd-s').textContent = String(s).padStart(2, '0');
      }

      function revealDate() {
        if (revealed) return;
        revealed = true;
        paper.classList.remove('dragging');
        paper.style.maxHeight = '';
        paper.classList.add('unrolled');
        hint.classList.add('hidden');

        const rect = paper.getBoundingClientRect();
        Petals.spawnBurst(rect.left + rect.width / 2, rect.top + 110);

        setTimeout(() => {
          postReveal.classList.add('revealed');
          postReveal.setAttribute('aria-hidden', 'false');
          calBtn.setAttribute('tabindex', '0');
          updateCountdown();
          setInterval(updateCountdown, 1000);
        }, 450);
      }

      const startDrag = (y) => {
        if (revealed) return;
        dragging = true; startY = y; pulled = 0;
        paper.classList.add('dragging');
      };
      const moveDrag = (y) => {
        if (!dragging || revealed) return;
        pulled = Math.max(0, y - startY);
        paper.style.maxHeight = `${Math.min(340, 22 + pulled * 1.4)}px`;
        if (pulled > 62) { dragging = false; revealDate(); }
      };
      const endDrag = () => {
        if (!dragging || revealed) return;
        dragging = false;
        if (pulled < 12 || pulled > 45) revealDate();
        else { paper.classList.remove('dragging'); paper.style.maxHeight = ''; }
      };

      if (window.PointerEvent) {
        tassel.addEventListener('pointerdown', (e) => {
          startDrag(e.clientY);
          try { tassel.setPointerCapture(e.pointerId); } catch (err) {}
        });
        tassel.addEventListener('pointermove', (e) => moveDrag(e.clientY));
        tassel.addEventListener('pointerup', endDrag);
        tassel.addEventListener('pointercancel', endDrag);
      } else {
        tassel.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
        tassel.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientY), { passive: true });
        tassel.addEventListener('touchend', endDrag);
        tassel.addEventListener('click', revealDate);
      }

      tassel.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); revealDate(); }
      });

      if ('IntersectionObserver' in window) {
        new IntersectionObserver((entries) => {
          sectionVisible = entries[0].isIntersecting;
          if (sectionVisible && revealed) updateCountdown();
        }, { threshold: 0.05 }).observe(document.getElementById('sec-save-date'));
      }

      // Single smart "Add to Calendar" button
      calBtn.onclick = () => {
        const ua = navigator.userAgent || '';
        const isAndroidInApp = /Android/i.test(ua) && /(FBAN|FBAV|Instagram|WhatsApp|wv)/i.test(ua);
        if (isAndroidInApp) {
          window.open(gcalFallbackUrl, '_blank', 'noopener');
          return;
        }
        const ics = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'BEGIN:VEVENT',
          `DTSTART:${fmtUtc(start)}`,
          `DTEND:${fmtUtc(end)}`,
          `SUMMARY:${WEDDING_CONFIG.couple.groom} & ${WEDDING_CONFIG.couple.bride} Wedding`,
          `LOCATION:${WEDDING_CONFIG.wedding.fullAddress}`,
          `DESCRIPTION:Pheras at ${WEDDING_CONFIG.wedding.pherasTime}. ${WEDDING_CONFIG.wedding.mapsUrl}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');
        try {
          const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'wedding-invitation.ics';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast('Calendar invite downloaded');
        } catch (e) {
          window.open(gcalFallbackUrl, '_blank', 'noopener');
        }
      };
    }

    function initScrollMotion() {
      const roses = Array.from(document.querySelectorAll('.ambient-rose'));
      const strands = Array.from(document.querySelectorAll('.marigold-strand'));
      let lastY = window.scrollY || window.pageYOffset || 0;
      let vel = 0, ticking = false;

      function update() {
        const y = window.scrollY || window.pageYOffset || 0;
        vel = Math.max(-14, Math.min(14, (y - lastY) * 0.45));
        lastY = y;

        roses.forEach((r, i) => {
          const sp = parseFloat(r.dataset.speed || '0.14');
          const dy = Math.max(-45, Math.min(45, (y * sp) % 90 - 45));
          const rot = Math.sin(y * 0.004 + i) * 3.5;
          r.style.transform = `translate3d(0, ${dy.toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg)`;
        });

        strands.forEach((s, i) => {
          const swing = vel * (i % 2 === 0 ? 0.55 : -0.45);
          s.style.transform = `rotate(${swing.toFixed(2)}deg)`;
        });
        ticking = false;
      }

      window.addEventListener('scroll', () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      }, { passive: true });
    }

          heroImgEl.src = blurCanvasCrossBrowser(hc, 6, false, 'jpeg');
          heroBaked = true;
        } catch (e) {
          heroBaked = false;
        }
      }
      if (!heroBaked && firstPhoto) {
        heroImgEl.src = firstPhoto.url;
        heroImgEl.classList.add('fallback-blur');
      }

      // 3. Build 3D Festivities & Story Carousels
      initCarousel('fest-carousel', 'fest-stage', 'fest-dots', WEDDING_CONFIG.functions, (fn, i) => {
        const card = document.createElement('div');
        card.className = 'c-card';
        const bgInfo = eventBgs[i];
        card.innerHTML = `
          <img class="event-bg${bgInfo.needsCssBlur ? ' fallback-blur' : ''}" src="${bgInfo.url}" alt="" />
          <div class="event-scrim"></div>
          <div class="event-content">
            <div class="event-icon-wrap">${eventIconSvg(fn.id)}</div>
            <div class="event-glass-box">
              <div class="event-name">${fn.name}</div>
              <div class="event-meta">
                <div><strong>${fn.date}</strong></div>
                <div>${fn.time}</div>
                <div>${fn.place}</div>
              </div>
            </div>
            <div class="dress-row">
              <span class="swatch" style="background:${fn.swatch}"></span>
              <span>${fn.dressCode} · ${fn.colourName}</span>
            </div>
          </div>`;
        return card;
      });

      initCarousel('story-carousel', 'story-stage', 'story-dots', WEDDING_CONFIG.photos, (p, i) => {
        const card = document.createElement('div');
        card.className = 'c-card story-card';
        card.innerHTML = `
          <img class="story-img" src="${loadedPhotos[i].url}" alt="Our story ${i + 1}" />
          <div class="story-cap">${p.caption}</div>`;
        return card;
      });

      await Promise.race([
        document.fonts ? document.fonts.ready : Promise.resolve(),
        new Promise((r) => setTimeout(r, 1500))
      ]);
      clearTimeout(failsafe);
      markReady();

      // 4. Book Opening Interaction
      let opened = false;
      const openBook = () => {
        if (!ready || opened) return;
        opened = true;
        bookStage.classList.add('opened');
        MusicPlayer.play();
        Petals.spawnShower(24);

        setTimeout(() => {
          document.getElementById('opening-screen').classList.add('zooming');
          document.body.classList.remove('locked');
          document.getElementById('ambient-roses').classList.add('visible');
          document.getElementById('marigold-bar').classList.add('visible');
          runHeroChoreography();
        }, 720);

        setTimeout(() => {
          document.getElementById('opening-screen').classList.add('gone');
        }, 1600);
      };

      bookStage.addEventListener('click', openBook);
      tapBtn.addEventListener('click', openBook);
      bookStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); }
      });

      // 5. Scroll Reveal + Off-screen Animation Pausing
      if ('IntersectionObserver' in window) {
        const revObs = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            if (en.isIntersecting) en.target.classList.add('in');
          });
        }, { threshold: 0.14 });
        document.querySelectorAll('.reveal-el').forEach((el) => revObs.observe(el));

        const pauseObs = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            en.target.classList.toggle('paused-anim', !en.isIntersecting);
          });
        }, { threshold: 0.01 });
        document.querySelectorAll('section.band').forEach((s) => pauseObs.observe(s));
      } else {
        document.querySelectorAll('.reveal-el').forEach((el) => el.classList.add('in'));
      }

      initSaveTheDate();
      initScrollMotion();
    }

    boot();
  </script>
</body>
</html>
